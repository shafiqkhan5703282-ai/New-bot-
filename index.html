<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsii-74 AI Signal Scanner</title>
    <style>
        body {
            background-color: #1a1714;
            color: #f0e6d2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .dashboard {
            background: #2b2520;
            border: 2px solid #3d342c;
            border-radius: 12px;
            padding: 24px;
            width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            text-align: center;
        }
        h2 {
            margin-top: 0;
            letter-spacing: 1px;
            color: #ffaa33;
            font-size: 1.4rem;
        }
        .control-group {
            margin-bottom: 12px;
            text-align: left;
        }
        label {
            font-size: 0.82rem;
            color: #b0a494;
            display: block;
            margin-bottom: 4px;
        }
        select {
            width: 100%;
            padding: 10px;
            background: #3d342c;
            color: #fff;
            border: 1px solid #4a3f35;
            border-radius: 6px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
        }
        .alert-screen {
            background: #12100e;
            border-radius: 8px;
            padding: 25px 10px;
            margin: 15px 0;
            border: 1px solid #4a3f35;
        }
        .signal-text {
            font-size: 2.8rem;
            font-weight: bold;
            margin: 8px 0;
            letter-spacing: 2px;
        }
        .BUY { color: #2ea043; text-shadow: 0 0 12px rgba(46,160,67,0.4); }
        .SELL { color: #f85149; text-shadow: 0 0 12px rgba(248,81,73,0.4); }
        .WAIT { color: #8b949e; }
        .btn-action {
            background: #ff8c00;
            color: #fff;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(255,140,0,0.3);
        }
        .btn-action:hover { background: #e07b00; }
        .status-bar {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #8b949e;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <h2>ARSII-74 SIGNAL SCANNER</h2>
    
    <div class="control-group">
        <label for="assetPair">Market Pair (Pocket Option / Quotex)</label>
        <select id="assetPair">
            <optgroup label="Pocket Option OTC">
                <option value="EURUSD_otc">EUR/USD (OTC)</option>
                <option value="GBPUSD_otc">GBP/USD (OTC)</option>
                <option value="USDJPY_otc">USD/JPY (OTC)</option>
                <option value="AUDCAD_otc">AUD/CAD (OTC)</option>
            </optgroup>
            <optgroup label="Quotex Markets">
                <option value="EURJPY_otc">EUR/JPY (OTC)</option>
                <option value="NZDUSD_otc">NZD/USD (OTC)</option>
                <option value="BTCUSD">BTC/USD</option>
            </optgroup>
        </select>
    </div>

    <div class="control-group">
        <label for="timeframe">Timeframe</label>
        <select id="timeframe">
            <option value="3s">3 Seconds</option>
            <option value="5s">5 Seconds</option>
            <option value="15s" selected>15 Seconds</option>
            <option value="30s">30 Seconds</option>
            <option value="1m">1 Minute</option>
            <option value="5m">5 Minutes</option>
            <option value="1h">1 Hour</option>
        </select>
    </div>

    <div class="alert-screen">
        <div id="pairDisplay" style="color: #b0a494; font-size: 0.9rem;">EUR/USD (OTC)</div>
        <div id="signalDisplay" class="signal-text WAIT">SCANNING</div>
        <div id="accuracyDisplay" style="font-size: 0.9rem; color: #d0c4b4;">Confidence: --%</div>
    </div>

    <button class="btn-action" onclick="triggerManualScan()">FORCE SCAN NOW</button>

    <div class="status-bar">
        <span>Engine: Active</span>
        <span id="timerCountdown">Next check: 3s</span>
    </div>
</div>

<script>
    // Web Audio API Synthesizer for High/Low Alerts
    function playAudioAlert(type) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.type = 'sine';
            osc.frequency.value = type === 'BUY' ? 880 : 440; // High pitch for BUY, lower for SELL
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.4);
            osc.stop(ctx.currentTime + 0.4);
        } catch(e) {
            console.log("Audio blocked until interaction.");
        }
    }

    function runSignalEngine() {
        const pairSelect = document.getElementById('assetPair');
        const selectedPairText = pairSelect.options[pairSelect.selectedIndex].text;
        document.getElementById('pairDisplay').innerText = selectedPairText;

        const signalElem = document.getElementById('signalDisplay');
        const accuracyElem = document.getElementById('accuracyDisplay');

        const randVal = Math.random();
        let signal = "WAIT";
        let accuracy = "--";

        if (randVal < 0.38) {
            signal = "BUY";
            accuracy = (88 + Math.random() * 9.5).toFixed(1);
        } else if (randVal > 0.62) {
            signal = "SELL";
            accuracy = (88 + Math.random() * 9.5).toFixed(1);
        }

        signalElem.innerText = signal;
        signalElem.className = 'signal-text ' + signal;
        
        if (signal !== "WAIT") {
            accuracyElem.innerText = 'Confidence: ' + accuracy + '%';
            playAudioAlert(signal);
        } else {
            accuracyElem.innerText = 'Analyzing market ticks...';
        }
    }

    function triggerManualScan() {
        document.getElementById('signalDisplay').innerText = "SCAN...";
        document.getElementById('signalDisplay').className = 'signal-text WAIT';
        setTimeout(runSignalEngine, 400);
    }

    let countdown = 3;
    setInterval(() => {
        countdown--;
        if (countdown <= 0) {
            runSignalEngine();
            countdown = 3;
        }
        document.getElementById('timerCountdown').innerText = 'Next check: ' + countdown + 's';
    }, 1000);
</script>

</body>
</html>
